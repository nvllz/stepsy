plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.nvllz.stepsy'
    compileSdk 35
    defaultConfig {
        applicationId "com.nvllz.stepsy"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 20
        versionName "1.6.2"
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    flavorDimensions += "distribution"

    productFlavors {
        create("full") {
            dimension = "distribution"
            buildConfigField "boolean", "HAS_PROPRIETARY_LIBRARIES", "true"
        }
        create("foss") {
            dimension = "distribution"
            buildConfigField "boolean", "HAS_PROPRIETARY_LIBRARIES", "false"
        }
    }
    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [icon: "@drawable/ic_launcher_debug"]
            applicationIdSuffix ".debug"
            versionNameSuffix '-debug'
            minifyEnabled false
        }
        release {
            manifestPlaceholders = [icon: "@drawable/ic_launcher"]
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Stepsy-${variant.versionName}-${variant.flavorName}.apk"
        }
    }
}

dependencies {
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.lifecycle:lifecycle-process:2.9.1"


    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"
    implementation 'com.google.android.material:material:1.13.0'

    fullImplementation 'com.google.android.gms:play-services-base:18.10.0'
    fullImplementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}