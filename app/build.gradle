plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id("org.jetbrains.kotlin.plugin.compose") version "2.2.20"
}

android { buildFeatures { compose = true } }

android {
    namespace 'com.nvllz.stepsy'
    compileSdk 35
    defaultConfig {
        applicationId "com.nvllz.stepsy"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 20
        versionName "1.6.2"
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    flavorDimensions += "distribution"

    productFlavors {
        create("full") {
            dimension = "distribution"
            buildConfigField "boolean", "HAS_PROPRIETARY_LIBRARIES", "true"
        }
        create("foss") {
            dimension = "distribution"
            buildConfigField "boolean", "HAS_PROPRIETARY_LIBRARIES", "false"
        }
    }
    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [icon: "@drawable/ic_launcher_debug"]
            resValue "string", "app_name", "Stepsy [debug]"
            applicationIdSuffix ".debug"
            versionNameSuffix '-debug'
            minifyEnabled false
        }
        release {
            manifestPlaceholders = [icon: "@drawable/ic_launcher"]
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Stepsy-${variant.versionName}-${variant.flavorName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "androidx.documentfile:documentfile:1.1.0"


    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation("androidx.lifecycle:lifecycle-process:2.10.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
    implementation 'com.google.android.material:material:1.14.0'

    implementation(platform("androidx.compose:compose-bom:2025.12.00"))
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.activity:activity-compose:1.10.1")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.10.0")
    implementation "androidx.work:work-runtime-ktx:2.10.1"

    fullImplementation 'com.google.android.gms:play-services-base:18.11.1'
    fullImplementation 'com.google.android.gms:play-services-location:21.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}